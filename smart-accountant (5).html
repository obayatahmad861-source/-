<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المحاسب الذكي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg: #1c1a18;
  --bg-raised: #26221e;
  --bg-raised-hover: #2e2924;
  --rule: #3a342c;
  --ink: #f5f0e6;
  --ink-dim: #a89e8e;
  --ink-faint: #746a5c;

  --paper: #faf5ea;
  --paper-shadow: #e6dcc6;
  --navy: #241f18;
  --navy-soft: #6e6455;

  --orange: #f2762e;
  --orange-2: #ff9d4d;
  --brand-grad: linear-gradient(135deg, var(--orange-2), var(--orange) 65%, #c94e1a);

  --green: #4caf7d;
  --green-soft: #1c2620;
  --rose: #e05a3a;
  --rose-soft: #2d1c15;

  --radius: 14px;
  --radius-sm: 8px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(900px 480px at 10% -10%, rgba(242,118,46,.09), transparent 60%),
    radial-gradient(800px 460px at 100% 0%, rgba(242,118,46,.05), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  min-height:100vh;
  padding:40px 20px 90px;
  line-height:1.5;
}

.wrap{max-width:740px;margin:0 auto;}

/* ---------- Header ---------- */
header.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:34px;
  padding-bottom:22px;
  border-bottom:1px solid var(--rule);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:var(--brand-grad);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 16px -4px rgba(242,118,46,.5);
}
.brand-mark svg{width:19px;height:19px;stroke:#1c1108;}
.brand-text .eyebrow{
  font-family:'Aref Ruqaa', serif;
  font-size:13px;letter-spacing:.02em;font-weight:700;
  color:var(--orange-2);
}
h1{font-family:'Aref Ruqaa', serif;font-size:30px;margin:2px 0 0;font-weight:700;letter-spacing:0;}

.stats{text-align:left;direction:ltr;}
.stats .total{
  font-family:'IBM Plex Mono',monospace;
  font-size:23px;font-weight:600;
  color:var(--orange-2);
  letter-spacing:-.01em;
}
.stats .count{font-size:11.5px;color:var(--ink-dim);margin-top:2px;font-family:'IBM Plex Mono',monospace;}

/* ---------- Dropzone ---------- */
.dropzone{
  border:1.5px dashed var(--rule);
  border-radius:var(--radius);
  background:var(--bg-raised);
  padding:38px 20px;
  text-align:center;
  cursor:pointer;
  transition:border-color .25s ease, background .25s ease, transform .15s ease;
  margin-bottom:24px;
}
.dropzone:hover{
  border-color:var(--orange);
  background:var(--bg-raised-hover);
}
.dropzone.drag{
  border-color:var(--orange-2);
  background:var(--bg-raised-hover);
  transform:scale(.995);
}
.dropzone .icon{
  width:34px;height:34px;margin:0 auto 12px;
  color:var(--orange);
}
.dropzone .icon svg{width:100%;height:100%;}
.dropzone .main-txt{font-family:'Aref Ruqaa', serif;font-weight:700;font-size:18px;}
.dropzone .sub-txt{font-size:11.5px;color:var(--ink-faint);margin-top:5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
#fileInput{display:none;}

/* ---------- Processing ---------- */
.processing{
  display:flex;align-items:center;gap:10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;color:var(--orange-2);
  padding:14px 4px;margin-bottom:8px;
}
.spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid #4a4238;border-top-color:var(--orange-2);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Banner ---------- */
.banner{
  border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;
  font-size:12.5px;font-family:'IBM Plex Mono',monospace;line-height:1.6;
  display:flex;align-items:flex-start;gap:10px;
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.banner .b-icon{flex-shrink:0;margin-top:1px;}
.banner.ok{background:var(--green-soft);border:1px solid rgba(76,175,125,.4);color:#a9dfc0;}
.banner.dup{background:var(--rose-soft);border:1px solid rgba(224,90,58,.4);color:#f2b09c;}
.banner.err{background:var(--rose-soft);border:1px solid rgba(224,90,58,.4);color:#f2b09c;}
.banner.summary{background:var(--bg-raised);border:1px solid var(--rule);color:var(--ink-dim);}
.banner ul{margin:6px 0 0;padding-inline-start:18px;}
.banner li{margin-bottom:2px;}

/* ---------- Month grouping ---------- */
.month-group{margin-bottom:8px;}
.month-header{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:32px 0 14px;
  padding-bottom:10px;
  border-bottom:1px solid var(--rule);
}
.month-name{
  font-family:'Aref Ruqaa', serif;
  font-size:19px;font-weight:700;
  color:var(--orange-2);
}
.month-sub{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
  direction:ltr;
}

/* ---------- Receipt card ---------- */
.receipt{
  background:var(--paper);
  color:var(--navy);
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  position:relative;
  margin-bottom:26px;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.65);
  transition:transform .2s ease, box-shadow .2s ease;
}
.receipt:hover{transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(0,0,0,.75);}
.receipt::after{
  content:'';
  position:absolute;left:0;right:0;bottom:-9px;height:16px;
  background:
    linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x,
    linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x;
}
.receipt-inner{padding:20px 22px 22px;}
.receipt-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px dashed var(--paper-shadow);
  padding-bottom:14px;margin-bottom:14px;
  gap:12px;
}
.merchant{font-family:'Aref Ruqaa', serif;font-weight:700;font-size:19px;letter-spacing:0;}
.merchant-loc{font-size:11px;color:var(--navy-soft);font-family:'IBM Plex Mono',monospace;margin-top:3px;}
.amount{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;direction:ltr;white-space:nowrap;color:var(--orange);}

.fields{
  display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--navy-soft);
}
.fields .k{opacity:.65;}
.fields .v{direction:ltr;text-align:left;color:var(--navy);font-weight:500;}

.receipt-actions{
  display:flex;justify-content:flex-end;margin-top:14px;gap:16px;
}
.act-btn{
  background:none;border:none;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  cursor:pointer;opacity:.6;transition:opacity .15s ease;
  display:flex;align-items:center;gap:5px;padding:2px;
}
.act-btn:hover{opacity:1;}
.act-btn svg{width:12px;height:12px;}
.act-btn.edit{color:var(--orange);}
.act-btn.del{color:var(--rose);}

/* ---------- Edit form ---------- */
.edit-fields{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;
  margin-bottom:6px;
}
.edit-field{display:flex;flex-direction:column;gap:3px;}
.edit-field.span2{grid-column:1 / -1;}
.edit-field label{
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--navy-soft);opacity:.75;
}
.edit-field input{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--navy);
  background:#fff;border:1px solid var(--paper-shadow);border-radius:6px;
  padding:7px 9px;outline:none;direction:ltr;text-align:left;
  transition:border-color .15s ease;
}
.edit-field input:focus{border-color:var(--orange);}
.edit-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;}
.save-btn, .cancel-btn{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
  padding:8px 16px;border-radius:7px;cursor:pointer;border:none;
}
.save-btn{background:var(--brand-grad);color:#1c1108;}
.cancel-btn{background:transparent;border:1px solid var(--paper-shadow);color:var(--navy-soft);}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;color:var(--ink-faint);
  font-family:'IBM Plex Mono',monospace;font-size:12px;
  padding:36px 0;
  border:1px dashed var(--rule);border-radius:var(--radius);
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l3 3v17H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      </div>
      <div class="brand-text">
        <div class="eyebrow">نظام محاسبة funtop لحفظ الوصولات والبيانات</div>
        <h1>المحاسب الذكي</h1>
      </div>
    </div>
    <div class="stats">
      <div class="total" id="totalAmount">0.00</div>
      <div class="count" id="totalCount">0 وصل مخزّن</div>
    </div>
  </header>

  <div class="dropzone" id="dropzone">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 18h16v3H4z"/></svg>
    </div>
    <div class="main-txt">اضغط أو اسحب صورة أو أكثر</div>
    <div class="sub-txt">وصل واحد أو صورة فيها كذا وصل — بيستخرجهم كلهم ويتحقق من التكرار</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div id="statusArea"></div>

  <div id="receiptList"></div>

</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusArea = document.getElementById('statusArea');
const receiptList = document.getElementById('receiptList');
const totalAmountEl = document.getElementById('totalAmount');
const totalCountEl = document.getElementById('totalCount');

let allReceipts = [];
let editingId = null;

const ICONS = {
  ok: '<svg class="b-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  dup: '<svg class="b-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  err: '<svg class="b-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
};

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFiles([...e.target.files]);
});

async function loadReceipts(){
  try{
    const res = await window.storage.get('receipts', true);
    if (!res) return [];
    return JSON.parse(res.value);
  }catch(e){ return []; }
}

async function saveReceipts(arr){
  await window.storage.set('receipts', JSON.stringify(arr), true);
}

function findDuplicate(newR, existing){
  return existing.find(r => {
    if (newR.tc_code && r.tc_code && newR.tc_code === r.tc_code) return true;
    if (newR.transaction_id && r.transaction_id && newR.transaction_id === r.transaction_id) return true;
    if (newR.invoice_number && r.invoice_number && newR.invoice_number === r.invoice_number
        && newR.rrn && r.rrn && newR.rrn === r.rrn) return true;
    return false;
  });
}

function resizeImageToBase64(file, maxDim = 1600, quality = 0.85){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function extractReceiptsFromImage(file){
  const base64 = await resizeImageToBase64(file);
  const mediaType = 'image/jpeg';

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 2000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text:
            `هاي الصورة ممكن يكون فيها وصل دفع واحد أو عدة وصولات مختلفة (مثلاً كذا وصل مصوّرين مع بعض أو مبسوطين جنب بعض). دقّق منيح وطلع كل وصل موجود بالصورة على حدا، حتى لو كانوا متشابهين بالشكل — كل وصل إله بياناته الخاصة (رقم فاتورة، تاريخ، مبلغ مختلف).

رجّع JSON فقط، بدون أي نص إضافي ولا markdown، بهاد الشكل بالضبط:
{
  "receipts": [
    {
      "is_receipt": true,
      "merchant": "",
      "location": "",
      "card_masked": "",
      "transaction_type": "",
      "date": "",
      "date_iso": "YYYY-MM-DD",
      "time": "",
      "sequence": "",
      "transaction_id": "",
      "rrn": "",
      "auth_code": "",
      "invoice_number": "",
      "tc_code": "",
      "total_amount": 0,
      "currency": ""
    }
  ]
}
"date" هو التاريخ متل ما هو مطبوع بالصورة، و"date_iso" هو نفس التاريخ محوّل لصيغة YYYY-MM-DD. اذا ما في ولا وصل دفع واضح بالصورة، رجّع "receipts": []. لأي حقل مش موجود لوصل معيّن خليه سترينغ فاضي "".`
          }
        ]
      }]
    })
  });

  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error('no response');
  let cleaned = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(cleaned);
  return Array.isArray(parsed.receipts) ? parsed.receipts : [];
}

async function handleFiles(files){
  let savedCount = 0, dupCount = 0, invalidCount = 0;
  const savedNames = [];
  const dupNotes = [];

  statusArea.innerHTML = `<div class="processing"><div class="spinner"></div> عم يقرا ${files.length > 1 ? files.length + ' صور' : 'الصورة'}...</div>`;

  const results = await Promise.all(files.map(f =>
    extractReceiptsFromImage(f).catch(err => { console.error(err); return null; })
  ));

  for (const receipts of results){
    if (!receipts){ invalidCount++; continue; }
    if (!receipts.length){ invalidCount++; continue; }

    for (const parsed of receipts){
      if (!parsed.is_receipt){ invalidCount++; continue; }
      const dup = findDuplicate(parsed, allReceipts);
      if (dup){
        dupCount++;
        dupNotes.push(`${parsed.merchant || 'وصل'} — ${parsed.date || ''} (مخزّن مسبقاً)`);
        continue;
      }
      parsed.id = (parsed.tc_code || parsed.transaction_id || parsed.invoice_number || (Date.now()+'-'+Math.random().toString(36).slice(2,7)));
      parsed.saved_at = Date.now();
      allReceipts.unshift(parsed);
      savedCount++;
      savedNames.push(`${parsed.merchant || 'وصل'} — ${parsed.total_amount ?? ''} ${parsed.currency||''}`);
    }
  }

  await saveReceipts(allReceipts);
  render();

  let html = '';
  if (savedCount){
    html += `<div class="banner ok">${ICONS.ok}<div>تم حفظ ${savedCount} وصل بنجاح.
      <ul>${savedNames.map(n=>`<li>${escapeHtml(n)}</li>`).join('')}</ul>
    </div></div>`;
  }
  if (dupCount){
    html += `<div class="banner dup">${ICONS.dup}<div>تم رفض ${dupCount} وصل لأنه مكرر.
      <ul>${dupNotes.map(n=>`<li>${escapeHtml(n)}</li>`).join('')}</ul>
    </div></div>`;
  }
  if (invalidCount && !savedCount && !dupCount){
    html = `<div class="banner err">${ICONS.err}<div>ما قدرت ألاقي وصل دفع واضح بالصور يلي رفعتها.</div></div>`;
  } else if (invalidCount){
    html += `<div class="banner err">${ICONS.err}<div>${invalidCount} صورة/عنصر تم تجاهله لأنه مش وصل واضح.</div></div>`;
  }
  statusArea.innerHTML = html;
  fileInput.value = '';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fieldRow(k,v){
  if (!v) return '';
  return `<div class="k">${k}</div><div class="v">${escapeHtml(v)}</div>`;
}

async function deleteReceipt(id){
  allReceipts = allReceipts.filter(r => r.id !== id);
  await saveReceipts(allReceipts);
  render();
}
window.deleteReceipt = deleteReceipt;

function startEdit(id){
  editingId = id;
  render();
  const el = document.getElementById('card-' + cssEscape(id));
  if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
window.startEdit = startEdit;

function cancelEdit(){
  editingId = null;
  render();
}
window.cancelEdit = cancelEdit;

async function saveEdit(id){
  const idx = allReceipts.findIndex(r => r.id === id);
  if (idx === -1) return;
  const get = (name) => document.getElementById(`f-${name}-${cssEscape(id)}`).value;
  const r = allReceipts[idx];
  r.merchant = get('merchant');
  r.location = get('location');
  r.date = get('date');
  r.date_iso = get('date_iso');
  r.time = get('time');
  r.card_masked = get('card_masked');
  r.transaction_type = get('transaction_type');
  r.invoice_number = get('invoice_number');
  r.rrn = get('rrn');
  r.auth_code = get('auth_code');
  r.tc_code = get('tc_code');
  r.total_amount = parseFloat(get('total_amount')) || 0;
  r.currency = get('currency');
  await saveReceipts(allReceipts);
  editingId = null;
  render();
}
window.saveEdit = saveEdit;

function cssEscape(id){
  return String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
}

function monthKey(r){
  let d;
  if (r.date_iso && /^\d{4}-\d{2}-\d{2}/.test(r.date_iso)) d = new Date(r.date_iso);
  if (!d || isNaN(d)) d = new Date(r.saved_at || Date.now());
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  try{
    return new Intl.DateTimeFormat('ar', {month:'long', year:'numeric', calendar:'gregory'}).format(d);
  }catch(e){
    return key;
  }
}

function editFieldHtml(id, name, label, value, span2){
  return `<div class="edit-field${span2?' span2':''}">
    <label>${label}</label>
    <input id="f-${name}-${cssEscape(id)}" value="${escapeHtml(value||'')}">
  </div>`;
}

function receiptCardHtml(r){
  const idc = cssEscape(r.id);
  if (editingId === r.id){
    return `
    <div class="receipt" id="card-${idc}">
      <div class="receipt-inner">
        <div class="edit-fields">
          ${editFieldHtml(r.id,'merchant','التاجر',r.merchant,true)}
          ${editFieldHtml(r.id,'location','الموقع',r.location,true)}
          ${editFieldHtml(r.id,'date','التاريخ',r.date)}
          ${editFieldHtml(r.id,'date_iso','تاريخ (YYYY-MM-DD)',r.date_iso)}
          ${editFieldHtml(r.id,'time','الوقت',r.time)}
          ${editFieldHtml(r.id,'card_masked','البطاقة',r.card_masked)}
          ${editFieldHtml(r.id,'transaction_type','نوع العملية',r.transaction_type)}
          ${editFieldHtml(r.id,'invoice_number','رقم الفاتورة',r.invoice_number)}
          ${editFieldHtml(r.id,'rrn','RRN',r.rrn)}
          ${editFieldHtml(r.id,'auth_code','AUTH CODE',r.auth_code)}
          ${editFieldHtml(r.id,'tc_code','TC',r.tc_code)}
          ${editFieldHtml(r.id,'total_amount','المبلغ',r.total_amount)}
          ${editFieldHtml(r.id,'currency','العملة',r.currency)}
        </div>
        <div class="edit-actions">
          <button class="cancel-btn" onclick="cancelEdit()">إلغاء</button>
          <button class="save-btn" onclick="saveEdit('${r.id}')">حفظ التعديل</button>
        </div>
      </div>
    </div>`;
  }
  return `
    <div class="receipt" id="card-${idc}">
      <div class="receipt-inner">
        <div class="receipt-top">
          <div>
            <div class="merchant">${escapeHtml(r.merchant || 'غير معروف')}</div>
            <div class="merchant-loc">${escapeHtml(r.location || '')}</div>
          </div>
          <div class="amount">${escapeHtml(String(r.total_amount ?? ''))} ${escapeHtml(r.currency||'')}</div>
        </div>
        <div class="fields">
          ${fieldRow('التاريخ', r.date)}
          ${fieldRow('الوقت', r.time)}
          ${fieldRow('البطاقة', r.card_masked)}
          ${fieldRow('نوع العملية', r.transaction_type)}
          ${fieldRow('رقم الفاتورة', r.invoice_number)}
          ${fieldRow('RRN', r.rrn)}
          ${fieldRow('AUTH CODE', r.auth_code)}
          ${fieldRow('TC', r.tc_code)}
        </div>
        <div class="receipt-actions">
          <button class="act-btn edit" onclick="startEdit('${r.id}')">${ICONS.pencil} تعديل</button>
          <button class="act-btn del" onclick="deleteReceipt('${r.id}')">${ICONS.trash} حذف</button>
        </div>
      </div>
    </div>`;
}

function render(){
  const list = allReceipts;
  let total = 0;
  list.forEach(r => { const n = parseFloat(r.total_amount); if (!isNaN(n)) total += n; });
  totalAmountEl.textContent = total.toFixed(2) + (list[0]?.currency ? ' ' + list[0].currency : '');
  totalCountEl.textContent = list.length + ' وصل مخزّن';

  if (!list.length){
    receiptList.innerHTML = `<div class="empty">لسا ما في وصولات مخزّنة — ارفع أول صورة فوق</div>`;
    return;
  }

  const groups = {};
  list.forEach(r => {
    const key = monthKey(r);
    (groups[key] = groups[key] || []).push(r);
  });
  const sortedKeys = Object.keys(groups).sort().reverse();

  receiptList.innerHTML = sortedKeys.map(key => {
    const items = groups[key];
    let sub = 0;
    items.forEach(r => { const n = parseFloat(r.total_amount); if (!isNaN(n)) sub += n; });
    const cur = items[0]?.currency || '';
    return `
      <div class="month-group">
        <div class="month-header">
          <span class="month-name">${monthLabel(key)}</span>
          <span class="month-sub">${sub.toFixed(2)} ${escapeHtml(cur)} · ${items.length} وصل</span>
        </div>
        ${items.map(receiptCardHtml).join('')}
      </div>
    `;
  }).join('');
}

(async function init(){
  allReceipts = await loadReceipts();
  render();
})();
</script>
</body>
</html>
